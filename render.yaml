services:
  - type: web
    name: navalhado-api
    env: node
    plan: free
    rootDir: Back
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/profissionais
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        value: https://navalhado.onrender.com,https://navalhado-1.onrender.com,https://navalhadoback.onrender.com,http://localhost:5173,http://localhost:3000
      - key: PROFISSIONAL_EMAIL
        sync: false
      - key: PROFISSIONAL_PASSWORD
        sync: false
      - key: PROFISSIONAL_NOME
        value: Profissional Navalhado
      - key: PROFISSIONAL_TELEFONE
        value: ""

  - type: static
    name: navalhado-web
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API
        value: https://navalhadoback.onrender.com/api
